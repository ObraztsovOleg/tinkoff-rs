name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler and its components.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-features --examples
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Code generation must not modify tracked sources
        run: git diff --exit-code

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p "test_sandbox_*.py"
      - name: Isolated PostgreSQL with pgvector
        run: |
          docker run -d --name tinkoff-controls-test -e POSTGRES_USER=tinkoff_campaign \
            -e POSTGRES_DB=dashboard_controls -e POSTGRES_PASSWORD=testonly -p 5432:5432 pgvector/pgvector:pg17
          for i in $(seq 1 60); do docker exec tinkoff-controls-test pg_isready -U tinkoff_campaign -d dashboard_controls && break; sleep 1; done
      - run: cargo build --features cli --bin tinkoff-bot
      - name: Migrations
        env:
          DATABASE_URL: postgres://tinkoff_campaign:testonly@127.0.0.1:5432/dashboard_controls
        run: |
          printf 'account_id = "acc"\nstrategy_id = "migrate-test"\n\n[risk]\nbudget_rub = "1000.00"\n\n[[universe]]\nuid = "00000000-0000-0000-0000-000000000001"\n\n[[strategies]]\nkind = "moving-average-trend"\nsignal_weight = "1"\n' > "$RUNNER_TEMP/migrate.toml"
          ./target/debug/tinkoff-bot --config "$RUNNER_TEMP/migrate.toml" migrate
      - name: Dashboard and control-plane tests on PostgreSQL
        env:
          SANDBOX_CONTROL_TEST_CONTAINER: tinkoff-controls-test
        run: python3 -m unittest tests.test_sandbox_control_postgres
      - name: Rust tests on PostgreSQL (control execution, semantic search)
        env:
          CONTROL_TEST_DATABASE_URL: postgres://tinkoff_campaign:testonly@127.0.0.1:5432/dashboard_controls
          DOCUMENTS_TEST_DATABASE_URL: postgres://tinkoff_campaign:testonly@127.0.0.1:5432/dashboard_controls
        run: |
          cargo test --test control_execution -- --ignored
          cargo test --features cli --bin tinkoff-bot semantic_search -- --ignored
      - name: Dashboard in a browser
        run: |
          python3 tests/dashboard_browser_fixture.py &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:18766/ >/dev/null && break; sleep 0.2; done
          node tests/dashboard_browser.mjs
