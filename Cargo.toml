[package]
name = "tinkoff-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "A typed T-Invest SDK and broker-neutral trading bot runtime"
repository = "https://github.com/ObraztsovOleg/tinkoff-rs"

[features]
default = ["bot"]
postgres = ["engine", "dep:sqlx"]
engine = []
strategies = ["engine"]
cli = [
    "engine",
    "postgres",
    "strategies",
    "dep:clap",
    "dep:toml",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:quick-xml",
    "dep:scraper",
    "dep:ego-tree",
    "dep:encoding_rs",
    "dep:regex",
]
bot = ["cli", "strategies", "postgres"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
ego-tree = { version = "0.10", optional = true }
encoding_rs = { version = "0.8", optional = true }
clap = { version = "4.5.47", features = ["derive", "env"], optional = true }
futures = "0.3.31"
prost = "0.13.5"
quick-xml = { version = "0.37", optional = true }
prost-types = "0.13.5"
regex = { version = "1", optional = true }
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls-native-roots"], optional = true }
rust_decimal = { version = "1.37.2", features = ["serde-with-str"] }
scraper = { version = "0.23", optional = true }
secrecy = "0.8.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
], optional = true }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
toml = { version = "0.9.5", optional = true }
tonic = { version = "0.12.3", features = ["tls", "tls-native-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.12.3"

[[bin]]
name = "tinkoff-bot"
path = "src/bin/tinkoff-bot.rs"
required-features = ["cli"]

[[example]]
name = "portfolio-strategy-demo"
path = "examples/portfolio-strategy-demo.rs"
required-features = ["engine"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"
