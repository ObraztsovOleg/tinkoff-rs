contour = "sandbox"
account_id = "replace-with-dedicated-sandbox-account-id"
# Считайте strategy_id идентификатором неизменяемой конфигурации. После изменения
# universe, состава/порядка strategies, signal_weight, kind или параметров задайте новый ID.
strategy_id = "moving-average-ensemble"
app_name = "ObraztsovOleg.tinkoff-rs.bot"
# Рабочий pool; runtime lease дополнительно удерживает одно отдельное соединение.
database_connections = 5

[risk]
budget_rub = "30000.00"
daily_loss_percent = "5.0"
max_drawdown_percent = "25.0"

# Проверка стакана перед рыночной заявкой (docs/LIVE-TRADING.ru.md): на реальном
# счёте по умолчанию 0,5% и 30 минут ожидания, в песочнице выключена.
# [execution]
# max_spread_percent = "0.5"
# spread_wait_minutes = 30

[[universe]]
uid = "replace-with-moex-instrument-uid-1"

[[universe]]
uid = "replace-with-moex-instrument-uid-2"

[[strategies]]
signal_weight = "1.0"
kind = "moving-average-trend"
fast_window = 50
slow_window = 200
band_percent = "1.0"
